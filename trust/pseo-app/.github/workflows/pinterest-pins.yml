name: Regenerate RSS Feeds & Deploy

# Runs once daily to rebuild the RSS XML files and redeploy to Cloudflare Pages.
# Publer polls each /rss/{slug}.xml URL on its own schedule and auto-schedules
# pins to the matching Pinterest board — no Pinterest API key required.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — A Cloudflare API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — Your Cloudflare account ID (found in CF dashboard)
#
# Old secrets that are NO LONGER needed (safe to delete):
#   PINTEREST_ACCESS_TOKEN
#   PINTEREST_BOARD_IDS

on:
  schedule:
    # Rebuild feeds daily at 05:00 UTC so Publer's morning polls get fresh content
    - cron: '0 5 * * *'

  # Allow manual re-runs from GitHub Actions tab
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  rss-and-deploy:
    name: Generate RSS Feeds & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    defaults:
      run:
        working-directory: trust/pseo-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: trust/pseo-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate RSS feeds
        run: node scripts/generate-rss.mjs

      - name: Build Next.js static export
        run: npx tsx scripts/generate-sitemaps.ts && npx next build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=pseo-app --branch=master

      - name: Write step summary
        if: always()
        run: |
          echo "### RSS Feed Regeneration & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Feed URLs (add these to Publer → Feeds → Add RSS Feed):**" >> $GITHUB_STEP_SUMMARY
          echo "| Board | Feed URL |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Astronomy Shirts | https://blackpantherstore.co.za/rss/astronomy-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Hobbies Shirts | https://blackpantherstore.co.za/rss/hobbies-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Animals Shirts | https://blackpantherstore.co.za/rss/animals-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Minimalist Engineer | https://blackpantherstore.co.za/rss/minimalist-engineer-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Minimalist Shirts | https://blackpantherstore.co.za/rss/minimalist-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Math Shirts | https://blackpantherstore.co.za/rss/math-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Engineer Shirts | https://blackpantherstore.co.za/rss/engineer-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Everyday Shirts | https://blackpantherstore.co.za/rss/everyday-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Professions Shirts | https://blackpantherstore.co.za/rss/professions-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Science Shirts | https://blackpantherstore.co.za/rss/science-shirts.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| All Products | https://blackpantherstore.co.za/rss/social.xml |" >> $GITHUB_STEP_SUMMARY
