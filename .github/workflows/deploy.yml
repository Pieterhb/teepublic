name: Deploy to Cloudflare Pages

# Builds the Next.js static export and deploys to Cloudflare Pages
# Runs on manual trigger (workflow_dispatch) or when manually triggered.

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    name: Build & Deploy Site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: trust/pseo-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: trust/pseo-app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Linux native bindings
        run: npm install --os=linux --cpu=x64 @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu

      - name: Generate RSS feeds
        run: node scripts/generate-rss.mjs

      - name: Generate sitemaps
        run: npx tsx scripts/generate-sitemaps.ts

      - name: Build Next.js static export
        run: npx next build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=pseo-app --branch=master
